name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  # The reference build: same generator, build type and precompiled header as
  # a developer machine, through the same script.
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for pybind11 detection)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure, build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Preset ci -Test

  # Portability and memory-safety check: GCC with the address and
  # undefined-behaviour sanitizers, on the fast part of the suite, without the
  # precompiled header so that missing includes are caught.
  linux-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMBD_COMPILE_JOBS=3
          -DMBD_TEST_PCH=OFF
          -DMBD_BUILD_PYTHON=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build the core test executables
        run: cmake --build build-linux --target test_core test_model test_algorithms test_invariants test_kernel

      - name: Run tests
        run: ctest --test-dir build-linux --output-on-failure -E "_NOT_BUILT"

