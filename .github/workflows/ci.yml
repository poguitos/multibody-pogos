name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  # The reference build: same generator, build type and precompiled header as
  # a developer machine, through the same script.
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Python interface is built and tested with Python 3.11 here and
      # 3.12 on the laptop (python/environment.yml), so that two versions are
      # covered (D52). Its tests need NumPy and pytest.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install NumPy and pytest
        run: 'python -m pip install --only-binary=:all: numpy pytest'

      - name: Configure, build and test
        shell: pwsh
        env:
          MBD_REGRESSION_REPORT: ${{ github.workspace }}/regression-report.csv
        run: ./scripts/build.ps1 -Preset ci -Python "$env:pythonLocation\python.exe" -Test

      # How many Python test files CTest ran, and with which Python: CMake
      # leaves them out, with only a line in the log, when NumPy or pytest is
      # missing.
      - name: Python tests counted
        if: always()
        shell: bash
        run: |
          count=$(ctest --test-dir build-ci -N -R "^Python: " | grep -c "Test *#" || true)
          echo "::notice title=Python tests ($(python --version 2>&1))::${count} test files registered"

      # The regression harness's worst difference per scenario, as annotations
      # (readable without logging in; plan task 5.5, D49).
      - name: Regression differences
        if: always()
        shell: bash
        run: |
          if [ -f regression-report.csv ]; then
            while IFS=, read -r name channel ratio difference tolerance; do
              echo "::notice title=Regression ${name} (Windows)::${channel}: ${difference} against ${tolerance} (${ratio} of the tolerance)"
            done < regression-report.csv
          fi

  # The Python package (plan task 6.2, D53): installed with pip install -e
  # from the checkout, as on a machine with only Python, git and a compiler
  # (pip picks Visual Studio's generator on Windows), and tested; then built
  # as a wheel, installed into an empty environment, tested there and kept
  # for 14 days. Linux has the oldest Python and NumPy that pyproject.toml
  # allows, Windows the newest Python. Three compilers where the build system
  # limits them (Ninja); the default for a user is one.
  python-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            numpy: 'numpy==2.0.*'
          - os: windows-latest
            python: '3.14'
            numpy: 'numpy'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package from the checkout
        run: python -m pip install -v -C cmake.define.MBD_COMPILE_JOBS=3 -e . "${{ matrix.numpy }}" pytest

      - name: Test the installed package
        run: |
          python -c "import multibody, numpy; print(multibody.__version__, multibody._mbd.__file__, 'NumPy', numpy.__version__)"
          python -m pytest -q -p no:cacheprovider -rs python/tests

      - name: Build a wheel
        run: python -m pip wheel -v --no-deps -C cmake.define.MBD_COMPILE_JOBS=3 -w dist .

      - name: Test the wheel in an empty environment
        run: |
          python -m venv clean
          if [ -x clean/Scripts/python.exe ]; then py=clean/Scripts/python.exe; else py=clean/bin/python; fi
          "$py" -m pip install dist/*.whl "${{ matrix.numpy }}" pytest
          "$py" -m pytest -q -p no:cacheprovider -rs python/tests
          wheel=$(ls dist/*.whl)
          echo "::notice title=Wheel (${{ matrix.os }})::$(basename "$wheel"), $(du -k "$wheel" | cut -f1) kB, tested with NumPy $("$py" -c 'import numpy; print(numpy.__version__)')"

      - name: Keep the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-python${{ matrix.python }}
          path: dist/*.whl
          retention-days: 14

  # Portability and memory-safety check: GCC with the address and
  # undefined-behaviour sanitizers, on the fast part of the suite, without the
  # precompiled header so that missing includes are caught. Any report fails
  # its test: the undefined-behaviour sanitizer otherwise recovers, and ctest
  # shows a passing test's output nowhere (D45).
  linux-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMBD_COMPILE_JOBS=3
          -DMBD_PCH=OFF
          -DMBD_BUILD_PYTHON=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Build the core test executables
        run: cmake --build build-linux --target test_core test_model test_kernel test_regression

      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          MBD_REGRESSION_REPORT: ${{ github.workspace }}/regression-report.csv
        run: ctest --test-dir build-linux --output-on-failure -E "_NOT_BUILT"

      # The regression harness's worst difference per scenario, as annotations
      # (readable without logging in; plan task 5.5, D49).
      - name: Regression differences
        if: always()
        shell: bash
        run: |
          if [ -f regression-report.csv ]; then
            while IFS=, read -r name channel ratio difference tolerance; do
              echo "::notice title=Regression ${name} (Linux)::${channel}: ${difference} against ${tolerance} (${ratio} of the tolerance)"
            done < regression-report.csv
          fi

  # The kernel must not allocate memory once set up (plan tasks 2.6, 2.10).
  # In a Debug build with EIGEN_RUNTIME_NO_MALLOC, any Eigen heap allocation
  # inside the checked calls fails an assertion. Runs the hidden [alloc] tests
  # of the kernel and test_alloc, which also counts every operator new.
  kernel-no-malloc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-nomalloc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMBD_COMPILE_JOBS=3
          -DMBD_PCH=OFF
          -DMBD_BUILD_PYTHON=OFF
          "-DCMAKE_CXX_FLAGS=-DEIGEN_RUNTIME_NO_MALLOC"

      - name: Build the allocation tests
        run: cmake --build build-nomalloc --target test_kernel test_alloc

      - name: Check that nothing allocates
        run: |
          ./build-nomalloc/tests/test_kernel "[alloc]"
          ./build-nomalloc/tests/test_alloc

  # The API reference (documentation track H, task H.5): Doxygen from the
  # header comments, every warning an error.
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja and Doxygen
        run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen

      - name: Configure
        run: >
          cmake -S . -B build-docs -G Ninja
          -DMBD_BUILD_PYTHON=OFF
          -DBUILD_TESTING=OFF

      - name: Build the API reference
        run: |
          doxygen --version
          cmake --build build-docs --target docs

      - name: Check that the reference was written
        run: |
          test -s build-docs/docs/html/index.html
          test -s build-docs/docs/html/annotated.html
          grep -q "ConstraintSolver" build-docs/docs/html/annotated.html
          echo "HTML pages: $(ls build-docs/docs/html/*.html | wc -l)"

  # Comparison with independent codes (plan task 5.3): random trees against
  # Pinocchio, closed mechanisms against Project Chrono. Both come from conda
  # (crosscheck/environment.yml pins the versions); micromamba installs them.
  crosscheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Pinocchio and PyChrono
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: crosscheck/environment.yml
          cache-environment: true

      - name: Configure
        run: >
          cmake -S . -B build-crosscheck -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMBD_COMPILE_JOBS=3
          -DMBD_BUILD_PYTHON=OFF
          -DBUILD_TESTING=OFF

      - name: Build the exporter
        run: cmake --build build-crosscheck --target mbd_crosscheck

      - name: Compare with Pinocchio
        shell: bash -el {0}
        run: |
          ./build-crosscheck/crosscheck/mbd_crosscheck trees trees.json 40 1
          python crosscheck/compare_pinocchio.py trees.json

      - name: Compare with Project Chrono
        shell: bash -el {0}
        run: |
          ./build-crosscheck/crosscheck/mbd_crosscheck mechanisms mechanisms.json 12 1
          python crosscheck/compare_chrono.py mechanisms.json
