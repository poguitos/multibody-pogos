name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  # The reference build: same generator, build type and precompiled header as
  # a developer machine, through the same script.
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (for pybind11 detection)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure, build and test
        shell: pwsh
        env:
          MBD_REGRESSION_REPORT: ${{ github.workspace }}/regression-report.csv
        run: ./scripts/build.ps1 -Preset ci -Test

      # The regression harness's worst difference per scenario, as annotations
      # (readable without logging in; plan task 5.5, D49).
      - name: Regression differences
        if: always()
        shell: bash
        run: |
          if [ -f regression-report.csv ]; then
            while IFS=, read -r name channel ratio difference tolerance; do
              echo "::notice title=Regression ${name} (Windows)::${channel}: ${difference} against ${tolerance} (${ratio} of the tolerance)"
            done < regression-report.csv
          fi

  # Portability and memory-safety check: GCC with the address and
  # undefined-behaviour sanitizers, on the fast part of the suite, without the
  # precompiled header so that missing includes are caught. Any report fails
  # its test: the undefined-behaviour sanitizer otherwise recovers, and ctest
  # shows a passing test's output nowhere (D45).
  linux-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMBD_COMPILE_JOBS=3
          -DMBD_PCH=OFF
          -DMBD_BUILD_PYTHON=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Build the core test executables
        run: cmake --build build-linux --target test_core test_model test_kernel test_regression

      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          MBD_REGRESSION_REPORT: ${{ github.workspace }}/regression-report.csv
        run: ctest --test-dir build-linux --output-on-failure -E "_NOT_BUILT"

      # The regression harness's worst difference per scenario, as annotations
      # (readable without logging in; plan task 5.5, D49).
      - name: Regression differences
        if: always()
        shell: bash
        run: |
          if [ -f regression-report.csv ]; then
            while IFS=, read -r name channel ratio difference tolerance; do
              echo "::notice title=Regression ${name} (Linux)::${channel}: ${difference} against ${tolerance} (${ratio} of the tolerance)"
            done < regression-report.csv
          fi

  # The kernel must not allocate memory once set up (plan tasks 2.6, 2.10).
  # In a Debug build with EIGEN_RUNTIME_NO_MALLOC, any Eigen heap allocation
  # inside the checked calls fails an assertion. Runs the hidden [alloc] tests
  # of the kernel and test_alloc, which also counts every operator new.
  kernel-no-malloc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-nomalloc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMBD_COMPILE_JOBS=3
          -DMBD_PCH=OFF
          -DMBD_BUILD_PYTHON=OFF
          "-DCMAKE_CXX_FLAGS=-DEIGEN_RUNTIME_NO_MALLOC"

      - name: Build the allocation tests
        run: cmake --build build-nomalloc --target test_kernel test_alloc

      - name: Check that nothing allocates
        run: |
          ./build-nomalloc/tests/test_kernel "[alloc]"
          ./build-nomalloc/tests/test_alloc

  # The API reference (documentation track H, task H.5): Doxygen from the
  # header comments, every warning an error.
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja and Doxygen
        run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen

      - name: Configure
        run: >
          cmake -S . -B build-docs -G Ninja
          -DMBD_BUILD_PYTHON=OFF
          -DBUILD_TESTING=OFF

      - name: Build the API reference
        run: |
          doxygen --version
          cmake --build build-docs --target docs

      - name: Check that the reference was written
        run: |
          test -s build-docs/docs/html/index.html
          test -s build-docs/docs/html/annotated.html
          grep -q "ConstraintSolver" build-docs/docs/html/annotated.html
          echo "HTML pages: $(ls build-docs/docs/html/*.html | wc -l)"

  # Comparison with independent codes (plan task 5.3): random trees against
  # Pinocchio, closed mechanisms against Project Chrono. Both come from conda
  # (crosscheck/environment.yml pins the versions); micromamba installs them.
  crosscheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Pinocchio and PyChrono
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: crosscheck/environment.yml
          cache-environment: true

      - name: Configure
        run: >
          cmake -S . -B build-crosscheck -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMBD_COMPILE_JOBS=3
          -DMBD_BUILD_PYTHON=OFF
          -DBUILD_TESTING=OFF

      - name: Build the exporter
        run: cmake --build build-crosscheck --target mbd_crosscheck

      - name: Compare with Pinocchio
        shell: bash -el {0}
        run: |
          ./build-crosscheck/crosscheck/mbd_crosscheck trees trees.json 40 1
          python crosscheck/compare_pinocchio.py trees.json

      - name: Compare with Project Chrono
        shell: bash -el {0}
        run: |
          ./build-crosscheck/crosscheck/mbd_crosscheck mechanisms mechanisms.json 12 1
          python crosscheck/compare_chrono.py mechanisms.json
